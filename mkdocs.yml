site_name: systemd-client
site_url: https://kalexnolasco.github.io/systemd-client/
site_description: High-level Python client for systemd user services
site_author: kalexnolasco
repo_url: https://github.com/kalexnolasco/systemd-client
repo_name: kalexnolasco/systemd-client

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - Sync Client: guide/sync-client.md
    - Async Client: guide/async-client.md
    - Journal: guide/journal.md
    - CLI: guide/cli.md
    - Backends: guide/backends.md
    - Error Handling: guide/errors.md
  - API Reference:
    - Client: api/client.md
    - Models: api/models.md
    - Enums: api/enums.md
    - Exceptions: api/exceptions.md
    - Journal: api/journal.md
    - Backends: api/backends.md
  - Examples: examples.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kalexnolasco/systemd-client
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/systemd-client/
